title = "gitleaks config"

# gitleaks 기본 규칙 세트를 상속한 뒤, 이 저장소 고유의 시크릿 패턴만 [[rules]]로 보강한다.
# 과거에는 `path = ""`(빈 경로)만 있어 어떤 규칙도 로드되지 않았고, 그래서 커밋된
# `.env.docker`의 NEXTAUTH_SECRET 이 한 번도 탐지되지 않았다.
[extend]
useDefault = true

# ------------------------------------------------------------------------------
# 프로젝트 고유 규칙
# `.env.docker` / `.env.docker.test` 는 배포 시크릿을 담으므로 반드시 스캔 대상이며
# allowlist 에 넣지 않는다. 두 파일이 .gitignore 로 빠진 뒤에도 이력 스캔
# (`gitleaks detect`)과 작업트리 스캔(`gitleaks dir . --no-git`) 양쪽에서 걸려야 한다.
# ------------------------------------------------------------------------------

[[rules]]
id = "sr-auth-signing-secret"
description = "NextAuth/Auth.js 서명 시크릿 하드코딩 (base64 32바이트 등 고엔트로피 값)"
regex = '''(?i)\b(?:nextauth_secret|auth_secret)\s*[:=]\s*['"]?([A-Za-z0-9+/]{32,}={0,2})['"]?'''
secretGroup = 1
keywords = ["nextauth_secret", "auth_secret"]
tags = ["secret", "auth", "nextauth"]

[[rules]]
id = "sr-postgres-password"
description = "POSTGRES_PASSWORD 하드코딩 (compose / env 파일)"
# 첫 글자에서 `$`, `?`, `{` 를 제외해 `${POSTGRES_PASSWORD:?...}` 같은 보간 구문은 걸지 않는다.
regex = '''(?i)\bpostgres_password\s*[:=]\s*['"]?([^\s'"$#?{][^\s'"#]{2,})['"]?'''
secretGroup = 1
keywords = ["postgres_password"]
tags = ["secret", "database"]

[[rules]]
id = "sr-postgres-connection-string"
description = "PostgreSQL 연결 문자열에 비밀번호 인라인 (DATABASE_URL/DIRECT_URL)"
regex = '''(?i)\bpostgres(?:ql)?://[^:\s'"/@]+:([^@\s'"]{3,})@'''
secretGroup = 1
keywords = ["postgresql://", "postgres://"]
tags = ["secret", "database"]

[allowlist]
description = "Common test fixtures and examples"
# 경로는 저장소 루트 기준 상대 경로로 평가되므로 `(^|/)` 로 시작을 함께 허용한다.
# (기존 `/docs?/` 형태는 선행 슬래시가 없는 `docs/...` 에 매칭되지 않아 무력했다.)
paths = [
  '''\.env\.example$''',
  '''(^|/)tests?/''',
  # `__tests__/` 는 위 `tests?/` 에 매칭되지 않는다("tests" 와 "__tests__" 는 다른 문자열).
  # 이 저장소의 단위 테스트는 전부 `__tests__/` 아래에 있어 그동안 전부 오탐이었다.
  '''(^|/)__tests__/''',
  '''(^|/)e2e/''',
  '''(^|/)docs?/''',
  # 시크릿의 "이름"과 형식을 설명하는 문서. 값은 전부 예시다.
  '''(^|/)\.github/SECRETS_SETUP\.md$''',
  # 빌드 산출물 — 커밋되지 않으므로 게이트 대상이 아니다.
  # (CI 는 깨끗한 체크아웃이라 존재하지 않지만, 로컬 실행 시 노이즈를 없앤다.)
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)coverage/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/'''
]
# 아래 regexes 를 **줄 전체**에 대해 평가한다.
# 기본값("secret")이면 규칙이 캡처한 조각(연결 문자열 규칙의 경우 비밀번호 부분)만 보게 되어,
# `postgresql://...@localhost/...` 같은 "문맥으로 판별해야 하는" 예외를 쓸 수 없다.
regexTarget = "line"

# 실제 값이 아닌 플레이스홀더는 노이즈이므로 제외한다.
regexes = [
  '''your_[a-z0-9_]*_here''',
  '''change_me[a-z0-9_]*''',
  # 로컬 전용 연결 문자열은 시크릿이 아니다.
  # CI 의 일회용 Postgres(러너 안에서만 존재), vitest 플레이스홀더, 테스트 픽스처가 여기 해당한다.
  # 실제 운영 자격증명은 localhost 를 가리키지 않으므로 이 예외가 진짜 유출을 가려 주지 않는다.
  '''postgres(?:ql)?://[^@\s'"]+@(?:localhost|127\.0\.0\.1|db|db-test)[:/]''',
  # CI 러너 안에서만 존재하는 일회용 DB 계정. 잡이 끝나면 DB 째로 사라진다.
  '''\bsr_ci\b'''
]
