services:
  nginx:
    image: nginx:alpine
    container_name: sr-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      # `- app` 만 적으면 "컨테이너가 떴다"까지만 기다린다. 앱이 마이그레이션 중이거나
      # 부팅에 실패했어도 nginx 가 먼저 떠서 502 를 뿌린다(감사 3.32).
      app:
        condition: service_healthy
    # nginx:alpine 은 유휴 시 ~10MB 다. 상한을 넉넉히 두되, 프록시 버퍼 폭주가
    # 호스트 전체를 잡아먹지 못하게 한다.
    mem_limit: 128m
    networks:
      - sr-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  app:
    # 배포는 커밋 SHA 태그를 주입한다(`APP_IMAGE_TAG`). 이전 SHA 로 값만 바꿔
    # `up -d` 하면 원커맨드 롤백이 된다. 값이 없으면 기존 동작(latest)을 유지한다.
    image: ghcr.io/lkindo/sr:${APP_IMAGE_TAG:-latest}
    container_name: sr-app
    restart: always
    expose:
      - '3000'
    env_file:
      - .env.docker
    environment:
      - NODE_OPTIONS=--max-old-space-size=450
      # 서버 로컬 타임존을 KST 로 고정(감사 3.25). 이미지에도 ENV 로 박혀 있지만,
      # 이미지를 바꾸지 않고도 운영 중 확인·변경할 수 있도록 여기에도 명시한다.
      - TZ=Asia/Seoul
      # 첨부파일 저장 위치(웹루트 밖). 아래 명명 볼륨이 이 경로에 마운트된다.
      - STORAGE_DIR=/app/var/uploads
    volumes:
      # 첨부파일 영속화 (재배포 시 유실 방지 + 웹루트 밖 보관)
      - sr_uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
    # 이미지의 HEALTHCHECK 와 동일한 검사. compose 쪽에도 명시해 두면
    # nginx 의 `condition: service_healthy` 가 이미지 버전과 무관하게 성립한다.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # 부팅 시 `prisma migrate deploy` 가 돌기 때문에 넉넉히 준다.
      start_period: 60s
    # 힙 상한이 450MB(NODE_OPTIONS)이고 그 밖에 Node 런타임·Prisma 엔진·소켓 버퍼가 붙는다.
    # 768m 은 정상 동작을 방해하지 않으면서, 폭주한 앱이 호스트(및 DB)를 끌어내리지
    # 못하게 하는 선이다.
    mem_limit: 768m
    networks:
      - sr-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  db:
    image: postgres:16-alpine
    container_name: sr-db
    restart: always
    environment:
      # 자격증명은 저장소에 두지 않는다. compose 가 배포 호스트의 기본 env 파일
      # (`/home/opc/sr/.env`) 또는 셸 환경에서 보간하며, 값이 비면 `:?` 문법으로
      # 즉시 실패한다 — 안전하지 않은 기본값으로 조용히 뜨는 것을 막는다.
      # 주의: POSTGRES_* 는 데이터 디렉터리가 비어 있는 최초 기동에만 반영된다.
      # 기존 볼륨의 비밀번호 교체는 `ALTER USER` 로 수행한다(docs/SECRET_ROTATION.md).
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # DB 이름은 비밀이 아니므로 기존 볼륨 호환을 위해 현재 값을 기본값으로 남긴다.
      - POSTGRES_DB=${POSTGRES_DB:-sr_db}
      # 세션 타임존. 저장은 timestamptz(UTC)로 그대로이고, `DATE(x AT TIME ZONE ...)`
      # 처럼 명시적으로 변환하는 쿼리도 영향받지 않는다. 타임존을 명시하지 않은
      # 임시 쿼리(psql 수동 조회 등)가 KST 로 보이게 하는 용도다.
      - PGTZ=Asia/Seoul
      - TZ=Asia/Seoul
    # 보안: DB 포트를 호스트로 공개하지 않는다. app 컨테이너는 내부 브리지(sr-net)로 접근한다.
    # 관리 접근이 필요하면 SSH 터널 또는 `docker exec`를 사용한다.
    # ports:
    #   - '5432:5432'
    volumes:
      - sr_db_data:/var/lib/postgresql/data
    healthcheck:
      # `$$` 는 compose 보간을 회피해 컨테이너 셸이 자신의 POSTGRES_* 환경변수를 읽게 한다.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sr-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  sr_db_data:
  sr_uploads:

networks:
  sr-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
