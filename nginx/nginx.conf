user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 압축 설정
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver 127.0.0.11 valid=30s;

    # ─────────────────────────────────────────────────────────────────────────
    # 프록시 헤더 버퍼
    #
    # 이 앱은 세션을 JWT 로 들고 다니며 그 안에 **역할·권한·소속 고객사를 전부** 담는다
    # (src/auth.ts 의 token.roles / token.permissions / token.clientIds). ADMIN 은 권한이
    # 30개가 넘으므로 `SR:CREATE` 같은 문자열이 그만큼 들어가고, 암호화된 세션 쿠키가
    # 수 KB 가 된다.
    #
    # nginx 기본 proxy_buffer_size 는 4k 다. 업스트림이 그보다 큰 응답 헤더
    # (`Set-Cookie` 에 실린 세션)를 보내면 nginx 는 그 응답을 버리고
    # **502 upstream sent too big header** 를 낸다.
    #
    # 증상이 고약한 이유: 익명 요청은 쿠키가 작아 멀쩡히 200 이고 **로그인한 사용자만**
    # 502 를 본다. 게다가 `/api/auth/session` 이 502 나면 useSession() 이 null 이 되어
    # `hasAnyRole()` 이 전부 false 를 반환하고, 그 결과 역할로 게이트된 사이드바 메뉴가
    # 조용히 사라진다 — "권한이 없어졌다" 처럼 보이지만 실제 원인은 이 버퍼다.
    #
    # http 블록에 두어 prod / staging / status 세 server 가 모두 상속받게 한다.
    # 요청 헤더 쪽(large_client_header_buffers)도 함께 올린다. 큰 쿠키는 응답뿐 아니라
    # 그 다음 **요청**에도 실려 오며, 그쪽이 넘치면 400/494 가 된다.
    #
    # 근본 해결은 아니다. 권한이 계속 늘면 다시 닿는다 — 세션에는 역할만 담고 권한은
    # 서버에서 조회하도록 바꾸는 것이 정답이며, 그건 별도 티켓이다.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    large_client_header_buffers 4 16k;

    # ─────────────────────────────────────────────────────────────────────────
    # HSTS (감사 4.1)
    #
    # 이 헤더가 없으면 브라우저는 사용자가 `lkindo.kr` 을 주소창에 칠 때마다 먼저
    # 평문 80 으로 접속한다. 위의 301 리다이렉트가 그것을 HTTPS 로 돌리지만,
    # **그 첫 요청 하나가 가로채기 지점**이다(SSL stripping). HSTS 는 브라우저가
    # 그 요청 자체를 하지 않게 만든다.
    #
    # max-age 2년. includeSubDomains 를 포함하는 이유는 test./status. 서브도메인이
    # 모두 이미 HTTPS 이기 때문이다 — 평문으로 서비스하는 서브도메인이 생기면
    # 접속 불가가 되므로, 새 서브도메인을 추가할 때 이 줄을 먼저 확인할 것.
    #
    # `preload` 는 **의도적으로 넣지 않았다.** 프리로드 목록 등재는 브라우저에
    # 하드코딩되어 사실상 되돌릴 수 없고, 별도 제출 절차가 필요하다. 소유자가
    # 그 영구성을 명시적으로 수용할 때 추가할 항목이지, 설정 정리 중에 딸려
    # 들어갈 항목이 아니다.
    #
    # `always` 가 필요한 이유: 없으면 2xx/3xx 응답에만 붙고 4xx/5xx 에는 빠진다.
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains";
    }

    # HTTP (80) -> HTTPS (443) 강제 리다이렉트
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt 인증서 챌린지 경로 허용
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (443) Production 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        # HTTP/2 (감사 4.5). 별도 `http2` 지시어 형태는 nginx 1.25.1+ 에서 유효하다
        # (`listen ... http2` 형태는 같은 버전부터 deprecated). 이미지가 nginx:alpine
        # 이므로 그보다 훨씬 최신이다. 다중 요청이 한 연결에서 다중화되어, 요청마다
        # 커넥션을 새로 여는 현재의 왕복 비용이 줄어든다.
        http2 on;
        server_name lkindo.kr www.lkindo.kr sr.lkindo.kr 134.185.106.129;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # Next.js 애플리케이션 프록시 설정
        location / {
            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }

    # HTTPS (443) Staging/Test 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name test.lkindo.kr;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # Next.js Staging 애플리케이션 프록시 설정
        location / {
            set $upstream_staging http://app-test:3000;
            proxy_pass $upstream_staging;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }

    # HTTPS (443) Status / Uptime Kuma 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name status.lkindo.kr;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # Uptime Kuma 애플리케이션 프록시 설정
        location / {
            # 위의 prod/staging 블록과 같은 지연 해석 패턴을 쓴다.
            #
            # `proxy_pass http://uptime-kuma:3001;` 처럼 호스트를 **직접** 적으면 nginx 가
            # **설정 로드 시점에** DNS 를 해석하고, 실패하면 기동 자체를 거부한다
            # (`[emerg] host not found in upstream`). uptime-kuma 컨테이너가 아직 안 떴거나
            # 잠시 내려가 있으면 **nginx 전체가 죽어 sr.lkindo.kr 까지 함께 내려간다** —
            # 감시 도구 하나 때문에 감시 대상이 죽는 형태다.
            #
            # 변수로 넘기면 해석이 요청 시점으로 미뤄져(`resolver 127.0.0.11`),
            # uptime-kuma 가 없을 때 이 호스트만 502 를 내고 나머지는 정상 동작한다.
            # 부수 효과로 `nginx -t` 가 컨테이너 밖에서도 통과해 배포 전 검증이 가능해진다.
            # 변수명 주의: `$upstream_status` 는 nginx upstream 모듈의 **내장 변수**라
            # 재정의하면 `[emerg] the duplicate "upstream_status" variable` 로 기동에 실패한다.
            set $upstream_kuma http://uptime-kuma:3001;
            proxy_pass $upstream_kuma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }
}
