user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 압축 설정
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver 127.0.0.11 valid=30s;

    # 응답 헤더에서 nginx 버전을 숨긴다. 버전이 박혀 있으면 공격자가 그 버전의
    # 알려진 취약점을 곧바로 조준할 수 있다. 기능 영향은 없다.
    server_tokens off;

    # ─────────────────────────────────────────────────────────────────────────
    # 레이트리밋 (프록시 계층)
    #
    # **왜 앱만으로는 부족한가.** 앱에도 인메모리 리미터가 있지만(src/lib/rate-limiter.ts)
    # 그건 요청이 Node 프로세스까지 **도달한 뒤**에 동작한다. 홍수가 오면 TLS 핸드셰이크·
    # 요청 파싱·JWT 복호화까지 다 하고 나서 거절하는 셈이라, 정작 막고 싶은 자원 고갈을
    # 막지 못한다. 여기서 자르면 앱은 그 요청을 보지도 않는다.
    #
    # **왜 앱보다 훨씬 느슨한가.** 두 계층은 세는 단위가 다르다.
    #   1. 앱은 로그인 상태면 세션 쿠키 해시로 키잉한다. nginx 는 IP 로만 키잉할 수 있어,
    #      NAT 뒤 사무실 N명이 **한 버킷을 공유**한다.
    #   2. 앱 미들웨어는 `/_next/`·정적 자산을 건너뛴다(src/proxy.ts). nginx 는 그것도
    #      전부 센다. Next.js 페이지 1회 로드가 수십 건이다.
    # 그래서 "앱 100/분" 과 "nginx 100/분" 은 전혀 다른 의미다. 정밀 통제는 앱에 남기고
    # 여기서는 조악한 홍수만 자른다.
    #
    # **키는 반드시 $binary_remote_addr 다.** docker-compose.prod.yml 이 80/443 을 직접
    # 바인드하므로 nginx 가 최전선이고, 따라서 X-Real-IP 는 **클라이언트가 임의로 채워
    # 보낼 수 있는 값**이다. 그걸로 키잉하면 요청마다 랜덤 헤더를 보내 제한을 100% 우회하고
    # zone 메모리까지 고갈시킨다. 앱이 X-Real-IP 를 신뢰하는 것은 아래 location 들이
    # $remote_addr 로 덮어쓰기 때문이며, 그 신뢰는 nginx 자신에게는 성립하지 않는다.
    #
    # **geo 예외를 두는 이유.** Docker 포트 퍼블리싱이 docker-proxy(유저랜드) 경로를 타면
    # $remote_addr 가 브리지 게이트웨이(172.x.0.1) 하나로 붕괴한다. 그러면 전 사용자가
    # 한 버킷을 공유해 서비스가 자멸한다. 사설 대역을 예외로 두면 그 시나리오에서
    # "제한 없음" 으로 **안전하게 실패**한다. uptime-kuma 프로브가 자기 자신을 스로틀하는
    # 것도 같이 막는다. 빈 키("")는 nginx 가 카운트하지 않는다.
    #
    # 한계: IPv6 리스너가 있어 키가 /128 단위다. /64 를 보유한 공격자는 주소를 갈아타며
    # 우회할 수 있다. 앞 64비트만 키로 쓰는 정규화는 별도 작업이다.
    geo $rl_exempt {
        default        0;
        127.0.0.1/32   1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;   # docker bridge (uptime-kuma 프로브, docker-proxy 폴백)
        192.168.0.0/16 1;
    }
    map $rl_exempt $rl_key {
        0 $binary_remote_addr;
        1 "";
    }

    # 업로드 zone 은 POST 에만 건다. 같은 경로의 GET(첨부 목록 조회)까지 1r/s 로 묶으면
    # SR 상세를 몇 개 연속으로 여는 정상 사용이 429 를 맞는다. 빈 키는 카운트되지 않는다.
    map $request_method $rl_upload_key {
        default "";
        POST    $rl_key;
    }

    # rate 산정 근거(앱 프리셋 대비):
    #   perimeter 30r/s  = 1800/분. 앱 MIDDLEWARE 100/분의 18배 — 위 비대칭 2가지를 흡수.
    #   login      1r/s  =   60/분. 앱 STRICT 5/분의 12배 — 스터핑(초당 수십~수백)은 확실히 자름.
    #   upload     1r/s          . 횟수 제한이 목적이 아니라 50MB 본문의 동시 유입 억제다.
    limit_req_zone  $rl_key        zone=req_perimeter:10m rate=30r/s;
    limit_req_zone  $rl_key        zone=req_login:5m      rate=1r/s;
    limit_req_zone  $rl_upload_key zone=req_upload:5m     rate=1r/s;
    limit_conn_zone $rl_upload_key zone=conn_upload:5m;

    # 기본값은 503 이다. 503(서버 장애)과 429(과다 요청)를 섞으면 관측이 오염되므로
    # 명시한다. 앱도 429 를 쓰지만 nginx 가 막은 요청은 앱에 도달조차 하지 않으므로
    # X-RateLimit-* 헤더가 겹칠 일은 없다.
    limit_req_status    429;
    limit_conn_status   429;
    limit_req_log_level warn;

    # ─────────────────────────────────────────────────────────────────────────
    # 프록시 헤더 버퍼
    #
    # 이 앱은 세션을 JWT 로 들고 다니며 그 안에 **역할·권한·소속 고객사를 전부** 담는다
    # (src/auth.ts 의 token.roles / token.permissions / token.clientIds). ADMIN 은 권한이
    # 30개가 넘으므로 `SR:CREATE` 같은 문자열이 그만큼 들어가고, 암호화된 세션 쿠키가
    # 수 KB 가 된다.
    #
    # nginx 기본 proxy_buffer_size 는 4k 다. 업스트림이 그보다 큰 응답 헤더
    # (`Set-Cookie` 에 실린 세션)를 보내면 nginx 는 그 응답을 버리고
    # **502 upstream sent too big header** 를 낸다.
    #
    # 증상이 고약한 이유: 익명 요청은 쿠키가 작아 멀쩡히 200 이고 **로그인한 사용자만**
    # 502 를 본다. 게다가 `/api/auth/session` 이 502 나면 useSession() 이 null 이 되어
    # `hasAnyRole()` 이 전부 false 를 반환하고, 그 결과 역할로 게이트된 사이드바 메뉴가
    # 조용히 사라진다 — "권한이 없어졌다" 처럼 보이지만 실제 원인은 이 버퍼다.
    #
    # http 블록에 두어 prod / staging / status 세 server 가 모두 상속받게 한다.
    # 요청 헤더 쪽(large_client_header_buffers)도 함께 올린다. 큰 쿠키는 응답뿐 아니라
    # 그 다음 **요청**에도 실려 오며, 그쪽이 넘치면 400/494 가 된다.
    #
    # 근본 해결은 아니다. 권한이 계속 늘면 다시 닿는다 — 세션에는 역할만 담고 권한은
    # 서버에서 조회하도록 바꾸는 것이 정답이며, 그건 별도 티켓이다.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    large_client_header_buffers 4 16k;

    # ─────────────────────────────────────────────────────────────────────────
    # HSTS (감사 4.1)
    #
    # 이 헤더가 없으면 브라우저는 사용자가 `lkindo.kr` 을 주소창에 칠 때마다 먼저
    # 평문 80 으로 접속한다. 위의 301 리다이렉트가 그것을 HTTPS 로 돌리지만,
    # **그 첫 요청 하나가 가로채기 지점**이다(SSL stripping). HSTS 는 브라우저가
    # 그 요청 자체를 하지 않게 만든다.
    #
    # max-age 2년. includeSubDomains 를 포함하는 이유는 test./status. 서브도메인이
    # 모두 이미 HTTPS 이기 때문이다 — 평문으로 서비스하는 서브도메인이 생기면
    # 접속 불가가 되므로, 새 서브도메인을 추가할 때 이 줄을 먼저 확인할 것.
    #
    # `preload` 는 **의도적으로 넣지 않았다.** 프리로드 목록 등재는 브라우저에
    # 하드코딩되어 사실상 되돌릴 수 없고, 별도 제출 절차가 필요하다. 소유자가
    # 그 영구성을 명시적으로 수용할 때 추가할 항목이지, 설정 정리 중에 딸려
    # 들어갈 항목이 아니다.
    #
    # `always` 가 필요한 이유: 없으면 2xx/3xx 응답에만 붙고 4xx/5xx 에는 빠진다.
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains";
    }

    # HTTP (80) -> HTTPS (443) 강제 리다이렉트
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt 인증서 챌린지 경로 허용
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (443) Production 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        # HTTP/2 (감사 4.5). 별도 `http2` 지시어 형태는 nginx 1.25.1+ 에서 유효하다
        # (`listen ... http2` 형태는 같은 버전부터 deprecated). 이미지가 nginx:alpine
        # 이므로 그보다 훨씬 최신이다. 다중 요청이 한 연결에서 다중화되어, 요청마다
        # 커넥션을 새로 여는 현재의 왕복 비용이 줄어든다.
        http2 on;
        server_name lkindo.kr www.lkindo.kr sr.lkindo.kr 134.185.106.129;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # ── SSE 는 반드시 제한 밖에 둔다 (감사: 레이트리밋 도입) ──────────────
        #
        # /api/realtime 은 별도 location 이 없으면 아래 `location /` 로 흡수되어
        # req_perimeter 를 그대로 맞는다. 그러면 안 되는 이유가 둘이다.
        #
        #   1. **연결이 몇 시간 유지된다.** RealtimeProvider 가 전역 레이아웃에 있어
        #      인증된 탭 1개당 EventSource 가 1개씩 상시 열린다. limit_conn 을 걸면
        #      정상 사용자가 새 탭을 여는 것만으로 자기 자신을 잠근다.
        #   2. **끊기면 무한 재연결 루프가 된다.** 서버가 `retry: 3000` 을 내리고
        #      use-realtime-status.ts 의 onerror 에는 백오프가 없다. 한 번 429 로
        #      끊으면 3초마다 재연결하며 스스로 예산을 계속 소진해 실시간이 영구히
        #      죽는다 — 고치려던 것보다 나쁜 상태다.
        #
        # `= ` 정확 매칭은 모든 prefix 매칭보다 우선하므로 `location /` 의 제한을
        # 확실히 피한다. limit_req / limit_conn 을 여기에 절대 넣지 말 것.
        location = /api/realtime {
            set $upstream_sse http://app:3000;
            proxy_pass $upstream_sse;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # SSE 는 응답을 버퍼링하면 이벤트가 흐르지 않는다.
            proxy_buffering off;
            proxy_read_timeout 1h;

            client_max_body_size 50m;
        }

        # ── 로그인만 좁게 제한 ────────────────────────────────────────────────
        #
        # **`location /api/auth/` prefix 로 걸면 앱이 멈춘다.** /api/auth/session 은
        # useSession 이 페이지 이동·포커스마다 호출하고 /api/auth/csrf 도 빈번하다.
        # 앱도 같은 이유로 STRICT 를 credentials 콜백에만 건다
        # (src/app/api/auth/[...nextauth]/route.ts). 정확 매칭만 쓴다.
        location = /api/auth/callback/credentials {
            limit_req zone=req_login burst=10 nodelay;

            set $upstream_login http://app:3000;
            proxy_pass $upstream_login;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }

        # ── 첨부 업로드: 동시 유입 억제 ───────────────────────────────────────
        #
        # 목적은 횟수 제한이 아니라 **50MB 본문의 동시 유입**을 막는 것이다. 앱
        # 컨테이너는 mem_limit 768m 이고 업로드 본문을 메모리에 버퍼링하므로,
        # IP 당 동시 5개(= 최대 250MB)가 상한선이다.
        #
        # zone 키가 POST 일 때만 채워지므로(위 $rl_upload_key) 같은 경로의 GET
        # (첨부 목록 조회)은 이 제한을 타지 않는다.
        #
        # ⚠️ client_max_body_size 를 빠뜨리면 nginx 기본값 1m 로 떨어져 업로드가
        #    413 으로 즉사한다. 이 값은 http 레벨이 아니라 location 마다 있다.
        location ~ ^/api/(attachments|srs/[^/]+/attachments)$ {
            limit_req  zone=req_upload burst=5 nodelay;
            limit_conn conn_upload 5;

            set $upstream_upload http://app:3000;
            proxy_pass $upstream_upload;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }

        # Next.js 애플리케이션 프록시 설정
        location / {
            # burst=100 nodelay 근거: Next.js 초기 로드는 병렬 자산 요청 수십 건을
            # 한꺼번에 낸다. burst 가 그것을 지연 없이 통과시키고, 지속 초과분만 429.
            #
            # ⚠️ 여기에 limit_conn 을 넣지 말 것. 이 server 는 `http2 on` 이고,
            #    HTTP/2 에서 limit_conn 은 TCP 연결이 아니라 **동시 스트림**을 센다.
            #    브라우저가 페이지 1회 로드에 20~50 스트림을 열므로 10~20 같은 값은
            #    정상 로드를 그대로 깨뜨린다.
            limit_req zone=req_perimeter burst=100 nodelay;

            set $upstream_prod http://app:3000;
            proxy_pass $upstream_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }

    # HTTPS (443) Staging/Test 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name test.lkindo.kr;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # prod 와 같은 이유로 SSE 를 제한 밖에 둔다(위 prod server 의 주석 참조).
        location = /api/realtime {
            set $upstream_staging_sse http://app-test:3000;
            proxy_pass $upstream_staging_sse;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_buffering off;
            proxy_read_timeout 1h;

            client_max_body_size 50m;
        }

        location = /api/auth/callback/credentials {
            limit_req zone=req_login burst=10 nodelay;

            set $upstream_staging_login http://app-test:3000;
            proxy_pass $upstream_staging_login;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }

        location ~ ^/api/(attachments|srs/[^/]+/attachments)$ {
            limit_req  zone=req_upload burst=5 nodelay;
            limit_conn conn_upload 5;

            set $upstream_staging_upload http://app-test:3000;
            proxy_pass $upstream_staging_upload;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }

        # Next.js Staging 애플리케이션 프록시 설정
        location / {
            limit_req zone=req_perimeter burst=100 nodelay;

            set $upstream_staging http://app-test:3000;
            proxy_pass $upstream_staging;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }

    # HTTPS (443) Status / Uptime Kuma 서버 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name status.lkindo.kr;

        # SSL 인증서 경로 설정
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security $hsts_header always;

        # Uptime Kuma 애플리케이션 프록시 설정
        location / {
            # 위의 prod/staging 블록과 같은 지연 해석 패턴을 쓴다.
            #
            # `proxy_pass http://uptime-kuma:3001;` 처럼 호스트를 **직접** 적으면 nginx 가
            # **설정 로드 시점에** DNS 를 해석하고, 실패하면 기동 자체를 거부한다
            # (`[emerg] host not found in upstream`). uptime-kuma 컨테이너가 아직 안 떴거나
            # 잠시 내려가 있으면 **nginx 전체가 죽어 sr.lkindo.kr 까지 함께 내려간다** —
            # 감시 도구 하나 때문에 감시 대상이 죽는 형태다.
            #
            # 변수로 넘기면 해석이 요청 시점으로 미뤄져(`resolver 127.0.0.11`),
            # uptime-kuma 가 없을 때 이 호스트만 502 를 내고 나머지는 정상 동작한다.
            # 부수 효과로 `nginx -t` 가 컨테이너 밖에서도 통과해 배포 전 검증이 가능해진다.
            # 변수명 주의: `$upstream_status` 는 nginx upstream 모듈의 **내장 변수**라
            # 재정의하면 `[emerg] the duplicate "upstream_status" variable` 로 기동에 실패한다.
            # limit_req 만 건다. **limit_conn 은 절대 넣지 말 것** — uptime-kuma 대시보드는
            # WebSocket 상시 연결이라 SSE 와 같은 이유로 끊긴다. 감시 도구가 감시를 못 하게
            # 만드는 설정이다.
            limit_req zone=req_perimeter burst=100 nodelay;

            set $upstream_kuma http://uptime-kuma:3001;
            proxy_pass $upstream_kuma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            client_max_body_size 50m;
        }
    }
}
