name: Prewarm Cache

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '대상 BASE_URL (예: https://preview.example.com)'
        required: true
        type: string
      session_cookie:
        description: '세션 쿠키 (선택)'
        required: false
        type: string
      warm_paths:
        description: '워밍 경로(콤마 구분). 미지정 시 기본값 사용'
        required: false
        type: string

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup pnpm
        # 버전은 package.json 의 `packageManager` 핀을 단일 원천으로 삼는다.
        # 여기에 `version:` 을 같이 주면 pnpm/action-setup 이
        # "Multiple versions of pnpm specified" 로 즉시 실패한다.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warm cache
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          SESSION_COOKIE: ${{ github.event.inputs.session_cookie }}
          WARM_PATHS: ${{ github.event.inputs.warm_paths }}
        run: pnpm run warm:dashboard
