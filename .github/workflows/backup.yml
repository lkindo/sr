name: Scheduled Backup

# 프로덕션 DB(pg_dump) + 첨부파일(uploads)을 서버 로컬로 백업하고 보존기간을 관리한다.
# 스크립트는 서버로 복사 후 실행하므로 이 워크플로만으로 자체 완결된다.
#
# 주의: 이 백업은 서버 로컬($BACKUP_DIR)에 저장된다. 디스크 물리 장애까지 대비하려면
#   오프호스트 복제가 필요하다(scripts/backup.sh 의 OFFSITE_CMD 훅 또는
#   docs/backup-and-restore.md 의 rclone/S3 예시 참고).

on:
  schedule:
    # 매일 UTC 18:00 = KST 03:00
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: '백업 보존 일수'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: DB + uploads backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copy backup scripts to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          source: 'scripts/backup.sh,scripts/restore.sh'
          target: '/home/opc/sr'

      - name: Run backup on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '14' }}
          # 백업 암호화 수신자(age 공개키 또는 gpg 키 ID). 미설정 시 평문으로 저장되고
          # 스크립트가 경고한다. 오프사이트로 내보내기 전에 반드시 등록할 것(감사 3.31).
          BACKUP_ENCRYPT_RECIPIENT: ${{ secrets.BACKUP_ENCRYPT_RECIPIENT }}
          # 오프호스트 복제 명령. 예: rclone copy /home/opc/sr/backups remote:sr-backups
          # 이 값이 없으면 백업은 프로덕션과 같은 디스크에만 남아 디스크·VM 유실에 무력하다.
          OFFSITE_CMD: ${{ secrets.BACKUP_OFFSITE_CMD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          envs: RETENTION_DAYS, BACKUP_ENCRYPT_RECIPIENT, OFFSITE_CMD
          script: |
            set -euo pipefail
            cd /home/opc/sr
            sed -i 's/\r$//' scripts/backup.sh scripts/restore.sh
            chmod +x scripts/backup.sh scripts/restore.sh
            RETENTION_DAYS="$RETENTION_DAYS" \
            BACKUP_ENCRYPT_RECIPIENT="${BACKUP_ENCRYPT_RECIPIENT:-}" \
            OFFSITE_CMD="${OFFSITE_CMD:-}" \
              bash scripts/backup.sh

      # 백업 실패는 조용히 지나가면 안 된다. 알아채는 시점이 "복구가 필요한 날" 이면 늦다.
      - name: Report backup failure
        if: failure()
        run: |
          echo "::error::야간 백업이 실패했습니다. 서버의 /home/opc/sr/backups 와 워크플로 로그를 확인하세요."
          echo "복구 절차: docs/backup-and-restore.md"
          exit 1
